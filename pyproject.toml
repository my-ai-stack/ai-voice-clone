[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-voice-clone"
version = "0.1.0"
description = "Clone any voice with AI using advanced TTS models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["tts", "voice-cloning", "ai", "audio", "coqui", "speech-synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "TTS>=0.21.0",
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/my-ai-stack/ai-voice-clone"
Repository = "https://github.com/my-ai-stack/ai-voice-clone"
HuggingFace = "https://huggingface.co/spaces/my-ai-stack/ai-voice-clone"
